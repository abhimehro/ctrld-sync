services:
  ctrld-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctrld-sync

    environment:
      TOKEN: ${TOKEN:-}
      PROFILE: ${PROFILE:-}
      NO_COLOR: ${NO_COLOR:-}
      JSON_LOG: ${JSON_LOG:-}

    # cache.get_cache_dir() → ~/.cache/ctrld-sync for appuser (see cache.py)
    volumes:
      - ./cache:/home/appuser/.cache/ctrld-sync

    restart: "no"
    stop_grace_period: 30s

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
