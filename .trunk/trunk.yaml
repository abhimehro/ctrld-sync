# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.29.0
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    - markdownlint
    - prettier
    - black
    - isort
  enabled:
    - mypy@2.4.1
    - grype@0.122.1
    - pinact@4.1.1
    - actionlint@1.7.12
    - bandit@1.9.4
    - checkov@3.4.6
    - deno@2.9.8
    - dotenv-linter@4.0.0
    - git-diff-check
    - hadolint@2.15.1
    - osv-scanner@2.7.1
    - ruff@0.17.6
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - terrascan@1.19.9
    - trivy@0.76.2
    - trufflehog@3.100.0
    - yamllint@1.38.0
  definitions:
    - name: ruff
      commands:
        - name: format
          enabled: true
actions:
  definitions:
    - id: pr-recap-sync
      display_name: PR Recap Sync
      description: Synchronize Linear issue with PR lifecycle
      run: scripts/git-hooks/pre-push-pr-recap.sh
      triggers:
        - git_hooks: [pre-push]
  disabled:
    - trufflehog-pre-commit
    - commitlint
    - trunk-check-pre-commit
    - trunk-fmt-pre-commit
  enabled:
    - trunk-check-pre-push
    - pr-recap-sync
    - trunk-announce
    - trunk-upgrade-available
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
tools:
  disabled:
    - ruby
  enabled:
    - snyk@1.1295.0
    - trivy@0.76.2
    - trufflehog@3.100.0
