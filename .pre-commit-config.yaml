repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version — keep aligned with the resolved uv.lock ruff and .trunk/trunk.yaml.
    # pyproject.toml only sets a floor (ruff>=0.16.2).
    rev: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # .devin/blueprint.yaml uses --- to separate per-platform blocks.
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-case-conflict
