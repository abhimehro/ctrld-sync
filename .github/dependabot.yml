version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "abhimehro"
    labels:
      - "dependencies"
      - "github_actions"

  # uv lockfile / pyproject dependency updates
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "abhimehro"
    labels:
      - "dependencies"
      - "python"
